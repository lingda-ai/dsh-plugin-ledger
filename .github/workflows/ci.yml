name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 插件声明 engines >= 18，矩阵覆盖 18 / 20 / 22 三个 LTS 口径
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 运行时零依赖，但**测试需要 devDependencies**（react / react-dom 用来渲染面板产物）。
      # 之前这里写着「不需要 npm install」，于是 client.test.mjs 与
      # client-artifact-render.test.mjs 在 CI 上必挂（ERR_MODULE_NOT_FOUND: react）。
      # --omit=peer：不把宿主包（@deepseek-ai/cordis、dsh-llm）拉进 CI。
      - name: Install dev dependencies
        run: npm install --omit=peer --no-audit --no-fund --ignore-scripts

      # 沙箱 env：测试不得依赖所在机器的 HOME / DSH_HOME（见 scripts/run-tests.mjs）
      - name: Unit tests
        run: node scripts/run-tests.mjs

      # 只在最新 LTS 上跑基准，避免不同机器的抖动造成噪声失败
      - name: Perf gate
        if: matrix.node == 22
        run: node --expose-gc scripts/bench.mjs --gate

      # 退出码约定：0 通过 / 1 契约不符 / 2 本机没有 DSH 运行时（SKIP）。
      # CI 里没有 @deepseek-ai/*，通常是 2 —— 把它当 SKIP，而不是失败；
      # 但也不能当成通过：真正要求「必须跑过」的是发布闸门，不是这里。
      - name: DSH contract smoke
        run: |
          set +e
          node scripts/smoke-dsh.mjs
          code=$?
          if [ "$code" = "2" ]; then
            echo "::notice::SKIP：CI 无 DSH 运行时（退出码 2）"
            exit 0
          fi
          exit "$code"
