name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 插件声明 engines >= 18，矩阵覆盖 18 / 20 / 22 三个 LTS 口径
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 运行时零依赖，但**测试需要 devDependencies**（react / react-dom 用来渲染面板产物）。
      # 之前这里写着「不需要 npm install」，于是 client.test.mjs 与
      # client-artifact-render.test.mjs 在 CI 上必挂（ERR_MODULE_NOT_FOUND: react）。
      # --omit=peer：不把宿主包（@deepseek-ai/cordis、dsh-llm）拉进 CI。
      - name: Install dev dependencies
        run: npm install --omit=peer --no-audit --no-fund --ignore-scripts

      - name: Unit tests
        run: node --test test/*.test.mjs

      # 只在最新 LTS 上跑基准，避免不同机器的抖动造成噪声失败
      - name: Perf gate
        if: matrix.node == 22
        run: node --expose-gc scripts/bench.mjs --gate

      # 外部运行时（@deepseek-ai/dsh-llm）在 CI 中不存在 → 自动 SKIP
      - name: DSH contract smoke
        run: node scripts/smoke-dsh.mjs
